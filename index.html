<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作る前に、4つだけ決める。</title>
<meta name="description" content="高知AI活用キャンプ2026 セミナー資料。壊れない自動化を作る前に決める4つのこと(どこで動かす / 誰がやる / どう見張る / どう引き継ぐ)">
<meta property="og:title" content="作る前に、4つだけ決める。">
<meta property="og:description" content="高知AI活用キャンプ2026 セミナー資料(syou)">
<meta property="og:type" content="website">
<meta property="og:image" content="https://nft-syou.github.io/kochi-ai-camp-2026-seminar/images/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="images/avatar.png">
<style>
  :root {
    --bg: #0b0b0b;
    --panel: #161616;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #ffa94d;
    --band: #e8772e;
    --line: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; margin: 0 0 14px; }
  h1 { font-size: clamp(20px, 3.4vw, 30px); margin: 0; color: var(--accent); line-height: 1.3; }
  .sub { color: var(--muted); margin: 0; font-size: 14px; }
  .sub a { color: var(--muted); }

  /* ---- viewer ---- */
  .viewer {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    user-select: none;
    touch-action: pan-y;
  }
  .viewer canvas { display: block; width: 100%; height: 100%; }
  .viewer:fullscreen { border: 0; border-radius: 0; }
  .viewer:fullscreen canvas { width: 100%; height: 100%; object-fit: contain; }
  .nav {
    position: absolute; top: 0; bottom: 0; width: 18%;
    display: flex; align-items: center; cursor: pointer;
    opacity: 0; transition: opacity .15s;
  }
  .nav.prev { left: 0; justify-content: flex-start; }
  .nav.next { right: 0; justify-content: flex-end; }
  .viewer:hover .nav, .viewer.touch .nav { opacity: 1; }
  .nav span {
    margin: 0 12px; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; font-size: 24px; line-height: 44px; text-align: center;
  }
  .nav.disabled { visibility: hidden; }
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 6px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    font-size: 13px; color: #fff;
    opacity: 0; transition: opacity .15s;
  }
  .viewer:hover .bar, .viewer.touch .bar { opacity: 1; }
  .bar .count { font-variant-numeric: tabular-nums; }
  .bar .spacer { flex: 1; }
  .bar button {
    background: none; border: 0; color: #fff; cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 4px;
  }
  .bar button:hover { background: rgba(255,255,255,.15); }
  .progress { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--band); width: 0; transition: width .2s; }

  /* ---- under the viewer ---- */
  .under { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 0; }
  .hint { color: var(--muted); font-size: 13px; }
  .btn {
    display: inline-block; padding: 9px 16px; border-radius: 8px;
    background: var(--band); color: #111; font-weight: 700; font-size: 14px; text-decoration: none;
  }
  .btn:hover { background: var(--accent); }

  /* ---- thumbnails ---- */
  .thumbs {
    display: flex; gap: 8px; overflow-x: auto; padding: 14px 2px 10px; margin: 8px 0 0;
    scroll-snap-type: x proximity; scrollbar-width: thin;
  }
  .thumb {
    flex: 0 0 auto; width: 160px; aspect-ratio: 16 / 9;
    background: var(--panel); border: 2px solid transparent; border-radius: 4px; overflow: hidden;
    cursor: pointer; position: relative; scroll-snap-align: start;
  }
  .thumb canvas { display: block; width: 100%; height: 100%; }
  .thumb.current { border-color: var(--accent); }
  .thumb .n { position: absolute; left: 4px; bottom: 2px; font-size: 11px; color: #fff; text-shadow: 0 0 3px #000; }
  @media (max-width: 600px) {
    .thumb { width: 112px; }
    .nav { display: none; }       /* 狭い画面はスワイプとタップで送る */
    .hint-wide { display: none; }
  }
  @media (min-width: 601px) { .hint-narrow { display: none; } }

  footer { color: var(--muted); font-size: 12px; margin: 28px 0 0; }
  footer p { margin: 4px 0; }
  .fallback { padding: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>作る前に、4つだけ決める。</h1>
      <p class="sub">高知AI活用キャンプ 2026(2026-10-10)／ syou(<a href="https://x.com/nft_syou">@nft_syou</a>)</p>
    </div>
    <a class="btn" href="deck.pdf" download>PDF をダウンロード</a>
  </header>

  <div class="viewer" id="viewer" tabindex="0" aria-label="スライド">
    <canvas id="main"></canvas>
    <div class="nav prev" id="prev"><span>&#8249;</span></div>
    <div class="nav next" id="next"><span>&#8250;</span></div>
    <div class="bar">
      <span class="count" id="count">読み込み中…</span>
      <span class="spacer"></span>
      <button id="fs" type="button">全画面</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="under">
    <span class="hint hint-wide">← → キー、クリック、スワイプでページ送り</span>
    <span class="hint hint-narrow">スワイプ、またはタップでページ送り(右側で次へ、左側で前へ)</span>
  </div>

  <div class="thumbs" id="thumbs"></div>

  <footer>
    <p>スライド本文 © syou。テーマは <a href="https://github.com/minorun365/minorun-marp-skill">minorun-marp-skill</a>(Apache License 2.0)。ソース: <a href="https://github.com/nft-syou/kochi-ai-camp-2026-seminar">GitHub</a></p>
  </footer>
</div>

<script type="module">
  const PDF_URL = "deck.pdf";
  const viewer = document.getElementById("viewer");
  const main = document.getElementById("main");
  const count = document.getElementById("count");
  const progress = document.getElementById("progress");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const thumbs = document.getElementById("thumbs");

  try {
    const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
    const pdf = await pdfjs.getDocument(PDF_URL).promise;
    const total = pdf.numPages;
    const pages = new Map();
    const getPage = (n) => pages.get(n) ?? (pages.set(n, pdf.getPage(n)), pages.get(n));

    // ---- メイン表示 ----
    let current = Math.min(Math.max(Number(location.hash.slice(1)) || 1, 1), total);
    let drawing = 0;
    async function draw(n) {
      const id = ++drawing;
      const page = await getPage(n);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const box = viewer.getBoundingClientRect();
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(box.width / base.width, box.height / base.height) * dpr;
      const vp = page.getViewport({ scale });
      const off = document.createElement("canvas");
      off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
      await page.render({ canvasContext: off.getContext("2d"), viewport: vp }).promise;
      if (id !== drawing) return; // もっと新しい描画が走っている
      main.width = off.width; main.height = off.height;
      main.getContext("2d").drawImage(off, 0, 0);
    }
    function show(n, pushHash = true) {
      current = Math.min(Math.max(n, 1), total);
      draw(current);
      count.textContent = `${current} / ${total}`;
      progress.style.width = `${(current / total) * 100}%`;
      prevBtn.classList.toggle("disabled", current === 1);
      nextBtn.classList.toggle("disabled", current === total);
      if (pushHash) history.replaceState(null, "", current === 1 ? location.pathname : `#${current}`);
      for (const t of thumbs.children) t.classList.toggle("current", Number(t.dataset.page) === current);
      thumbs.children[current - 1]?.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      if (current < total) getPage(current + 1); // 次を先読み
    }
    const next = () => show(current + 1);
    const prev = () => show(current - 1);

    prevBtn.addEventListener("click", (e) => { e.stopPropagation(); prev(); });
    nextBtn.addEventListener("click", (e) => { e.stopPropagation(); next(); });
    main.addEventListener("click", (e) => { (e.clientX - main.getBoundingClientRect().left) < main.clientWidth / 3 ? prev() : next(); });
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
      else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
      else if (e.key === "Home") show(1);
      else if (e.key === "End") show(total);
      else if (e.key === "f") toggleFs();
    });
    // スワイプ
    let sx = null, sy = null;
    viewer.addEventListener("touchstart", (e) => { viewer.classList.add("touch"); sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    viewer.addEventListener("touchend", (e) => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? next() : prev();
      sx = sy = null;
    }, { passive: true });
    // 全画面
    function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : viewer.requestFullscreen?.(); }
    document.getElementById("fs").addEventListener("click", (e) => { e.stopPropagation(); toggleFs(); });
    document.addEventListener("fullscreenchange", () => draw(current));
    let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => draw(current), 150); });
    window.addEventListener("hashchange", () => { const n = Number(location.hash.slice(1)); if (n && n !== current) show(n, false); });

    // ---- サムネイル(見えたものから描く) ----
    for (let i = 1; i <= total; i++) {
      const t = document.createElement("div");
      t.className = "thumb"; t.dataset.page = i;
      t.innerHTML = `<canvas></canvas><span class="n">${i}</span>`;
      t.addEventListener("click", () => show(i));
      thumbs.appendChild(t);
    }
    const io = new IntersectionObserver(async (entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        io.unobserve(e.target);
        const page = await getPage(Number(e.target.dataset.page));
        const c = e.target.querySelector("canvas");
        const vp = page.getViewport({ scale: 320 / page.getViewport({ scale: 1 }).width });
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }
    }, { root: thumbs, rootMargin: "0px 600px" });
    for (const t of thumbs.children) io.observe(t);

    show(current, false);
  } catch (err) {
    console.error(err);
    count.textContent = "";
    viewer.innerHTML = `<div class="fallback">このブラウザでは表示できませんでした。<a href="${PDF_URL}">deck.pdf を開く</a></div>`;
  }
</script>
</body>
</html>
