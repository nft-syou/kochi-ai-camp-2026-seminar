<meta property="og:title" content="作る前に、4つだけ決める。">

<style>
  :root {
    --bg: #0b0b0b;
    --panel: #161616;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #ffa94d;
    --band: #e8772e;
    --line: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 16px 20px;
  }
  .eyebrow {
    color: var(--band);
    font-size: 14px;
    letter-spacing: .08em;
    margin: 0 0 6px;
  }
  h1 {
    font-size: clamp(26px, 5vw, 42px);
    margin: 0 0 8px;
    color: var(--accent);
    line-height: 1.3;
  }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  .sub a { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 8px; }
  .btn {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
  }
  .btn.primary { background: var(--band); border-color: var(--band); color: #111; font-weight: 700; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent); }
  .status { color: var(--muted); font-size: 13px; min-height: 1.6em; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }
  .page {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .page canvas { display: block; width: 100%; height: 100%; }
  .slide { margin: 0 0 14px; }
  .slide .num {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    margin: 4px 2px 0;
  }
  .fallback {
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
  }
  footer {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 60px;
    color: var(--muted);
    font-size: 13px;
  }
  footer p { margin: 4px 0; }

<body>
<header>
  <p class="eyebrow">高知AI活用キャンプ 2026 ／ 2026-10-10</p>
  <h1>作る前に、4つだけ決める。</h1>
  <p class="sub">壊れない自動化を作る前に決める4つのこと ── どこで動かす？ 誰がやる？ どう見張る？ どう引き継ぐ？<br>
    話した人: syou(<a href="https://x.com/nft_syou">@nft_syou</a>)</p>
  <div class="actions">
    <a class="btn primary" href="deck.pdf" download>PDF をダウンロード</a>
    <a class="btn" href="deck-notes.pdf">トークメモ付き PDF</a>
    <a class="btn" href="https://github.com/nft-syou/kochi-ai-camp-2026-seminar/tree/main/examples/folder-sort">例題の実装例</a>
    <a class="btn" href="https://github.com/nft-syou/kochi-ai-camp-2026-seminar">GitHub</a>
  </div>
  <p class="status" id="status">スライドを読み込んでいます…</p>
</header>

<main id="pages"></main>

<footer>
  <p>スライド本文・トークメモ © syou。テーマと検査ツールは <a href="https://github.com/minorun365/minorun-marp-skill">minorun-marp-skill</a>(Apache License 2.0)。</p>
  <p>表示がうまくいかないときは <a href="deck.pdf">deck.pdf</a> を直接開いてください。</p>
</footer>

<script type="module">
  const PDF_URL = "deck.pdf";
  const status = document.getElementById("status");
  const root = document.getElementById("pages");

  function showFallback(msg) {
    status.textContent = "";
    root.innerHTML = `<div class="fallback">${msg} <a href="${PDF_URL}">deck.pdf を開く</a></div>`;
  }

  try {
    const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const pdf = await pdfjs.getDocument(PDF_URL).promise;
    const total = pdf.numPages;
    status.textContent = `全 ${total} 枚。スクロールで読めます。`;

    // 枠だけ先に並べ、画面に入ったページから描く
    const holders = [];
    for (let i = 1; i <= total; i++) {
      const wrap = document.createElement("div");
      wrap.className = "slide";
      wrap.innerHTML = `<div class="page" data-page="${i}"><canvas></canvas></div><div class="num">${i} / ${total}</div>`;
      root.appendChild(wrap);
      holders.push(wrap.querySelector(".page"));
    }

    const rendered = new Set();
    async function render(div) {
      const n = Number(div.dataset.page);
      if (rendered.has(n)) return;
      rendered.add(n);
      const page = await pdf.getPage(n);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssWidth = div.clientWidth;
      const base = page.getViewport({ scale: 1 });
      const scale = (cssWidth * dpr) / base.width;
      const viewport = page.getViewport({ scale });
      const canvas = div.querySelector("canvas");
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    }

    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) { render(e.target); io.unobserve(e.target); }
      }
    }, { rootMargin: "800px 0px" });
    holders.forEach((d) => io.observe(d));
  } catch (err) {
    console.error(err);
    showFallback("このブラウザではスライドを埋め込み表示できませんでした。");
  }
</script>
</body>
</html>
